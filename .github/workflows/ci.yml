name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Lint
        run: npx eslint .

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        worker: [ingest, api]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: workers/${{ matrix.worker }}/package-lock.json

      - name: Install ${{ matrix.worker }} dependencies
        working-directory: workers/${{ matrix.worker }}
        run: npm ci

      - name: Build ${{ matrix.worker }} worker
        working-directory: workers/${{ matrix.worker }}
        run: npx wrangler deploy --dry-run

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        worker: [ingest, api]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: workers/${{ matrix.worker }}/package-lock.json

      - name: Install ${{ matrix.worker }} dependencies
        working-directory: workers/${{ matrix.worker }}
        run: npm ci

      - name: Test ${{ matrix.worker }} worker
        working-directory: workers/${{ matrix.worker }}
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium (and OS deps)
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
