name: Deploy

on:
  push:
    tags: ['v*']  # e.g., v0.1.0, v1.2.3-rc.1

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false


jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: workers/ingest/package-lock.json

      - name: Install ingest dependencies
        working-directory: workers/ingest
        run: npm ci

      - name: Apply D1 migrations
        working-directory: workers/ingest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 migrations apply watchtower --remote

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        worker: [ingest, api]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: workers/${{ matrix.worker }}/package-lock.json

      - name: Install ${{ matrix.worker }} dependencies
        working-directory: workers/${{ matrix.worker }}
        run: npm ci

      - name: Deploy ${{ matrix.worker }} worker
        working-directory: workers/${{ matrix.worker }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
