<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Watch Tower</title>

    <!--fonts-->
    <!-- //Nunito -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!--Add others' pages css here-->
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/performance_summary.css" />
  </head>
  <body>
    <!--NavBar-->
    <nav class="navbar">
      <a class="navbar-logo" onclick="navigate('projects')">WatchTower</a>
      <div class="navbar-divider"></div>
      <div class="navbar-project">App-Name▾</div>
      <div class="navbar-right">
        <a class="navbar-icon" title="Notifications">
          <img
            class="navbar-icon"
            src="img/notification.png"
            alt="notification icon"
          />
        </a>
        <button
          class="navbar-icon"
          id="themeBtn"
          onclick="toggleTheme()"
          title="Toggle dark mode"
        >
          <img
            class="navbar-icon"
            src="img/lightMode.png"
            alt="light mode icon"
          />
        </button>
        <div class="avatar">User</div>
      </div>
    </nav>
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <a
        class="sidebar-btn active"
        data-route="dashboard"
        onclick="navigate('dashboard')"
      >
        <img src="img/homeIcon.png" alt="home icon" />
        <span class="sidebar-tooltip">Dashboard</span>
      </a>
      <a class="sidebar-btn" data-route="errors" onclick="navigate('errors')">
        <img src="img/log.png" alt="log icon" />

        <span class="sidebar-tooltip">Logs</span>
      </a>
      <div class="sidebar-spacer"></div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main">
      <!-- PROJECT SELECTION -->
      <div class="page" id="page-projects">
        <div class="page-header">
          <div class="page-title">Your Projects</div>
        </div>
        <!-- project cards go here -->
        <p>This is projects page</p>
      </div>

      <!-- HOME DASHBOARD -->
      <div class="page" id="page-dashboard">
        <div class="page-header">
          <div class="page-title">Dashboard</div>
        </div>
        <!-- KPI cards, charts, recent errors go here -->
        <!-- <p>This is dashboard</p> -->
        <section class="dashboard-content">

          <!-- status -->
          <div class="live-status-container">
            <span id="site-status-dot" class="live-dot"></span>

            <span id="site-status" class="live-text">
              LIVE
            </span>
          </div>

          <!-- performance summary -->
          <section class="metrics-row">

            <!-- total errors -->
            <div class="metric-card">
              <h3>Total Errors</h3>
              <p
                class="metric-number error-number"
                id="total-errors"
              >
                0
              </p>

              <p
                class="metric-change increase"
                id="error-change"
              >
                Loading...
              </p>
            </div>

            <!-- response time -->
            <div class="metric-card">
              <h3>Response Time</h3>

              <p
                class="metric-number response-number"
                id="avg-response-time"
              >
                0ms
              </p>

              <p
                class="metric-change decrease"
                id="response-change"
              >
                Loading...
              </p>
            </div>

          </section>

    <!-- graphs -->
    <section class="charts-row">

      <!-- Error Rate Chart -->
      <div class="chart-card">
        <h3>Error Rate Chart</h3>

        <div
          class="bar-chart"
          id="error-rate-chart"
        >
        </div>
      </div>

      <!-- response time chart -->
      <div class="chart-card">
        <h3>Response Time Chart</h3>

        <svg
          id="response-chart"
          class="response-chart"
          viewBox="0 0 300 150"
        >
          <polyline
            id="response-line"
            points=""
          />
        </svg>

      </div>

    </section>

  </section>
      </div>

      <!-- ERROR LOG -->
      <div class="page" id="page-errors">
        <div class="page-header">
          <div class="page-title">Error Log</div>
        </div>
        <!-- search bar, filter, table go here -->
        <p>This is error log</p>
      </div>

      <!-- SETTINGS -->
      <div class="page" id="page-settings">
        <div class="page-header">
          <div class="page-title">Settings</div>
        </div>
        <!-- settings content go here -->
      </div>
    </main>

    <!--Add scripts here-->
    <script src="js/router.js"></script>
    <script src="js/darkmode.js" defer></script>
    <script src="js/mock_dashboard_data.js"></script>
  </body>
</html>
